name: Check transient Premium hint
on:
  pull_request:
    paths: ['src/**', 'build.py', 'tests/test-wordmark*', 'tests/test-device-icons.py', 'tests/test-profile*', 'tests/test-archive*', 'data/**', 'tests/test-premium-hint*.cjs', 'tests/test-launch-package.cjs', 'tests/test-reading-tools*.cjs', 'tests/test-listening*', 'tests/listening-protected.json', 'tools/listening_catalog.py', 'tools/generate_icons.py', 'tools/preview_bundle.py', 'notes/preview.html', '.github/workflows/premium-hint-checks.yml']
permissions:
  contents: read
jobs:
  hint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
      - run: pip install pillow
      - run: python3 build.py
      - run: python3 tests/test-wordmark.py
      - run: python3 tests/test-device-icons.py
      - run: python3 tests/test-profile.py
      - run: python3 tests/test-archive.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-launch-package.cjs
      - run: node tests/test-reading-tools.cjs
      - run: node tests/test-listening.cjs
      - run: node --test tests/test-listening-model.mjs tests/test-listening-adapter.mjs tests/test-listening-continuity.mjs tests/test-listening-buffering.mjs
      - run: node tests/test-premium-hint.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-premium-hint-browser.cjs
      - run: node tests/test-wordmark-browser.cjs
      - run: node tests/test-profile-browser.cjs
      - run: node tests/test-archive-browser.cjs
      - run: node tests/test-reading-tools-browser.cjs
      - run: node tests/test-listening-browser.cjs
      - run: node tests/test-usability-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-hint-screenshots
          path: test-artifacts/
          if-no-files-found: warn
